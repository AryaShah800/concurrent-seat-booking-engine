<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seat map</title>
<style>
  :root {
    --bg: #0f1013;
    --surface: #17181c;
    --raised: #2c2f37;
    --line: rgba(236, 233, 226, 0.09);
    --text: #ece9e2;
    --text-2: #a7a59e;
    --text-3: #6f6e69;
    --accent: #e8b04a;
    --accent-ink: #1a1305;
    --booked: #24262c;
    --booked-mark: #8e8d87;
    --danger: #e5766a;
    --ok: #86b894;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--sans); }
  .page { max-width: 1120px; margin: 0 auto; padding: 32px 24px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-2); font-size: 14px; margin-top: 4px; }
  .legend { display: flex; gap: 20px; color: var(--text-2); font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 3px 3px 5px 5px; display: inline-block; }
  .dot-booked { position: relative; background: var(--booked); box-shadow: inset 0 0 0 1px rgba(236,233,226,0.10); }
  .dot-booked::after { content: "\d7"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--booked-mark); font: 500 13px/1 var(--sans); }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }
  .hall { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 32px 24px 28px; overflow-x: auto; }
  .stage { width: 72%; margin: 0 auto 36px; height: 6px; border-radius: 0 0 40px 40px; background: var(--text-3); opacity: 0.55; }
  .stage-label { text-align: center; color: var(--text-3); font-size: 12px; margin: -26px 0 28px; letter-spacing: 0.02em; }
  .rows { display: grid; gap: 8px; justify-content: center; min-width: max-content; }
  .row { display: grid; grid-auto-flow: column; grid-auto-columns: 32px; gap: 8px; align-items: center; }
  .row-label { color: var(--text-3); font: 12px var(--mono); width: 20px; text-align: right; margin-right: 8px; grid-column: auto; }
  .row { grid-template-columns: 28px; grid-auto-columns: 32px; }
  .seat { width: 32px; height: 30px; border: 0; padding: 0; border-radius: 6px 6px 10px 10px; background: var(--raised);
          box-shadow: inset 0 0 0 1px var(--line); color: var(--text-2); font: 11px var(--mono); cursor: pointer;
          transition: background 120ms, transform 120ms; }
  .seat:hover:not(:disabled) { background: #3a3e48; transform: translateY(-1px); color: var(--text); }
  @media (max-width: 600px) { .seat { width: 36px; height: 36px; } .row { grid-auto-columns: 36px; gap: 6px; } }
  .seat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seat.held { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-3); cursor: not-allowed; }
  .seat.mine { background: var(--accent); color: var(--accent-ink); box-shadow: none; cursor: default; }
  .seat.booked { position: relative; background: var(--booked); box-shadow: inset 0 0 0 1px rgba(236,233,226,0.10); color: transparent; cursor: not-allowed; }
  .seat.booked::after { content: "\d7"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                        color: var(--booked-mark); font: 500 20px/1 var(--sans); }
  .seat.picked { outline: 2px solid var(--accent); outline-offset: 2px; }
  aside { display: grid; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .card h2 { font-size: 13px; font-weight: 500; color: var(--text-2); margin: 0 0 12px; }
  .big { font: 500 34px/1.1 var(--mono); letter-spacing: -0.02em; }
  .muted { color: var(--text-2); font-size: 13px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button.btn { font: 500 14px var(--sans); border-radius: 8px; padding: 9px 14px; border: 1px solid var(--line); background: var(--raised);
               color: var(--text); cursor: pointer; }
  button.btn:hover:not(:disabled) { background: #363a43; }
  button.btn:disabled { color: var(--text-3); cursor: not-allowed; }
  button.btn.primary { background: var(--text); color: #15161a; border-color: transparent; }
  button.btn.primary:hover:not(:disabled) { background: #fff; }
  button.btn.primary:disabled { background: var(--raised); color: var(--text-3); }
  .bar { height: 4px; border-radius: 2px; background: var(--raised); margin-top: 14px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 250ms linear; }
  .result { font: 13px/1.6 var(--mono); color: var(--text-2); margin-top: 12px; }
  .result b { color: var(--text); font-weight: 500; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--raised); border: 1px solid var(--line);
           padding: 10px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 160ms; }
  .toast.show { opacity: 1; }
  .toast.err { border-color: rgba(229, 118, 106, 0.5); }
  .empty { text-align: center; color: var(--text-2); padding: 48px 0; }
  .counts { display: flex; gap: 20px; font: 13px var(--mono); color: var(--text-2); }
  .counts b { color: var(--text); font-weight: 500; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div>
      <h1 id="title">Seat map</h1>
      <div class="sub" id="sub">Holds last a few minutes. Two people cannot hold one seat.</div>
    </div>
    <div class="legend" aria-hidden="true">
      <span><i class="dot" style="background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)"></i>Free</span>
      <span><i class="dot" style="box-shadow:inset 0 0 0 1.5px var(--text-3)"></i>Held</span>
      <span><i class="dot" style="background:var(--accent)"></i>Yours</span>
      <span><i class="dot dot-booked"></i>Booked</span>
    </div>
  </header>

  <div class="layout">
    <section class="hall" aria-label="Seats">
      <div class="stage"></div>
      <div class="stage-label">Screen</div>
      <div id="rows" class="rows"></div>
    </section>

    <aside>
      <div class="card" id="selection">
        <h2>Your hold</h2>
        <div id="holdBody" class="muted" aria-live="polite">Pick a free seat to hold it.</div>
      </div>
      <div class="card">
        <h2>Race on one seat</h2>
        <div class="muted">Sends 20 simultaneous hold requests for the selected seat from 20 different customers.</div>
        <div class="actions"><button class="btn" id="race" disabled>Run race</button></div>
        <div class="result" id="raceResult" aria-live="polite"></div>
      </div>
      <div class="card">
        <h2>Hall</h2>
        <div class="counts" id="counts"></div>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  // Only a numeric show id is used; it also ends up in the page text.
  const rawShow = new URLSearchParams(location.search).get('show');
  const showId = /^\d{1,9}$/.test(rawShow || '') ? rawShow : '1';
  const params = new URLSearchParams(location.search);
  const me = params.get('as') || sessionStorage.getItem('customer') || ('guest-' + Math.random().toString(36).slice(2, 8));
  sessionStorage.setItem('customer', me);
  const $ = (id) => document.getElementById(id);
  let seats = [];
  let hold = null;          // { holdId, seatId, label, expiresAt, total, idempotencyKey }
  let busy = false;         // a hold/confirm/release request is in flight
  let picked = null;        // selected seat id (for the race)

  const toast = (msg, err) => {
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast', 2600);
  };

  async function api(path, opts = {}) {
    // Spread opts first: spreading it last let opts.headers replace the merged headers, which
    // dropped Content-Type on Confirm (it sends Idempotency-Key) and the API answered 415.
    const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
    const text = await res.text();
    let body = null; try { body = text ? JSON.parse(text) : null; } catch (e) { body = null; }
    return { ok: res.ok, status: res.status, body };
  }

  async function load() {
    const r = await api('/api/shows/' + showId + '/seats');
    if (!r.ok) { seats = []; render(); return; }
    seats = r.body;
    render();
  }

  function rowOf(label) { return label.replace(/[0-9]/g, ''); }

  function render() {
    const rows = $('rows');
    if (!seats.length) {
      // Built with textContent, never innerHTML: the id comes from the URL.
      const empty = document.createElement('div'); empty.className = 'empty';
      empty.textContent = 'No show with id ' + showId + ' yet.';
      const actions = document.createElement('div'); actions.className = 'actions'; actions.style.justifyContent = 'center';
      const create = document.createElement('button'); create.className = 'btn primary'; create.id = 'create';
      create.textContent = 'Create a demo show'; create.onclick = createShow;
      actions.appendChild(create); empty.appendChild(actions);
      rows.replaceChildren(empty);
      $('counts').innerHTML = '';
      return;
    }
    const byRow = new Map();
    seats.forEach(s => { const k = rowOf(s.label); (byRow.get(k) || byRow.set(k, []).get(k)).push(s); });
    rows.innerHTML = '';
    for (const [name, list] of byRow) {
      const row = document.createElement('div'); row.className = 'row';
      row.style.gridTemplateColumns = '20px repeat(' + list.length + ', 32px)';
      const lab = document.createElement('span'); lab.className = 'row-label'; lab.textContent = name; row.appendChild(lab);
      list.forEach(s => {
        const b = document.createElement('button');
        const mine = hold && hold.seatId === s.id;
        b.className = 'seat ' + (mine ? 'mine' : s.status.toLowerCase()) + (picked === s.id ? ' picked' : '');
        b.textContent = s.label.replace(/^[A-Z]+/, '');
        b.title = s.label + (mine ? ' (yours)' : ' (' + s.status.toLowerCase() + ')');
        b.setAttribute('aria-label', 'Seat ' + s.label + ', ' + (mine ? 'held by you' : s.status.toLowerCase()));
        b.disabled = s.status !== 'AVAILABLE';
        b.setAttribute('aria-pressed', String(picked === s.id));
        b.onclick = () => selectSeat(s);
        row.appendChild(b);
      });
      rows.appendChild(row);
    }
    const n = (st) => seats.filter(s => s.status === st).length;
    $('counts').innerHTML = '<span><b>' + n('AVAILABLE') + '</b> free</span><span><b>' + n('HELD') + '</b> held</span><span><b>' + n('BOOKED') + '</b> booked</span>';
    if (picked && !seats.find(s => s.id === picked && s.status === 'AVAILABLE')) picked = null;
    $('race').disabled = !picked;
    if (!hold) renderSelection();
  }

  // Selecting a seat no longer holds it, so "Run race" works on any free seat you pick.
  function selectSeat(s) {
    picked = s.id;
    render();
  }

  let shownSelection = null;
  function renderSelection() {
    const body = $('holdBody');
    const s = seats.find(x => x.id === picked);
    // Rebuild only when the selection changes, so the 3 s refresh keeps keyboard focus.
    const key = (s ? s.id : '') + '|' + busy;
    if (key === shownSelection && body.dataset.mode === 'select') return;
    shownSelection = key; body.dataset.mode = 'select';
    body.replaceChildren();
    if (!s) { body.className = 'muted'; body.textContent = 'Pick a free seat to hold it or race for it.'; return; }
    body.className = '';
    const label = document.createElement('div'); label.className = 'muted'; label.textContent = 'Seat ' + s.label + ' selected';
    const actions = document.createElement('div'); actions.className = 'actions';
    const holdBtn = document.createElement('button'); holdBtn.className = 'btn primary'; holdBtn.textContent = 'Hold this seat';
    holdBtn.disabled = busy; holdBtn.onclick = () => holdSeat(s);
    actions.appendChild(holdBtn); body.append(label, actions);
  }

  async function createShow() {
    const r = await api('/api/shows', { method: 'POST', body: JSON.stringify({ name: 'Evening screening', startsAt: new Date(Date.now() + 86400000).toISOString(), rows: 8, seatsPerRow: 12 }) });
    if (r.ok) { location.search = '?show=' + r.body.id; } else toast('Could not create the show', true);
  }

  async function holdSeat(s) {
    if (hold) { toast('Release or confirm your current hold first', true); return; }
    if (busy) return;
    busy = true; renderSelection();
    try {
      const r = await api('/api/holds', { method: 'POST', body: JSON.stringify({ seatId: s.id, customerId: me }) });
      if (r.status === 201) {
        const exp = new Date(r.body.expiresAt).getTime();
        // One Idempotency-Key per hold: a retried or double-clicked confirm is the same request.
        hold = { holdId: r.body.holdId, seatId: s.id, label: s.label, expiresAt: exp, total: exp - Date.now(), idempotencyKey: crypto.randomUUID() };
        picked = null;
        buildHold();
      } else if (r.status === 409) {
        toast('Seat ' + s.label + ' was just taken by someone else', true);
      } else toast('Hold failed (' + r.status + ')', true);
    } finally {
      busy = false;
    }
    await load();
  }

  // The hold panel is built once; the 250 ms tick only updates the countdown text and bar,
  // so keyboard focus on Confirm/Release survives (rebuilding innerHTML used to drop it).
  function buildHold() {
    const body = $('holdBody');
    body.className = ''; body.replaceChildren(); body.dataset.mode = 'hold';
    const label = document.createElement('div'); label.className = 'muted'; label.textContent = 'Seat ' + hold.label + ' held for you';
    const clock = document.createElement('div'); clock.className = 'big'; clock.id = 'holdClock';
    clock.setAttribute('aria-live', 'off');
    const bar = document.createElement('div'); bar.className = 'bar';
    const fill = document.createElement('i'); fill.id = 'holdBar'; bar.appendChild(fill);
    const actions = document.createElement('div'); actions.className = 'actions';
    const confirmBtn = document.createElement('button'); confirmBtn.className = 'btn primary'; confirmBtn.id = 'confirm'; confirmBtn.textContent = 'Confirm booking';
    const releaseBtn = document.createElement('button'); releaseBtn.className = 'btn'; releaseBtn.id = 'release'; releaseBtn.textContent = 'Release';
    confirmBtn.onclick = confirm_; releaseBtn.onclick = release_;
    actions.append(confirmBtn, releaseBtn);
    body.append(label, clock, bar, actions);
    tickHold();
  }

  function tickHold() {
    if (!hold) return;
    const left = Math.max(0, hold.expiresAt - Date.now());
    if (left === 0) { hold = null; toast('Your hold expired'); load(); return; }
    const s = Math.ceil(left / 1000);
    $('holdClock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    $('holdBar').style.width = (100 * left / hold.total) + '%';
  }

  function setHoldButtonsBusy(on) {
    busy = on;
    ['confirm', 'release'].forEach(id => { const b = $(id); if (b) b.disabled = on; });
  }

  async function confirm_() {
    if (busy || !hold) return;
    setHoldButtonsBusy(true);
    const current = hold;
    const r = await api('/api/bookings', { method: 'POST', headers: { 'Idempotency-Key': current.idempotencyKey }, body: JSON.stringify({ holdId: current.holdId, customerId: me }) });
    setHoldButtonsBusy(false);
    if (r.status === 201 || r.status === 200) {
      toast('Booked seat ' + current.label); hold = null;
    } else toast('Could not confirm (' + r.status + ')', true);
    await load();
  }

  async function release_() {
    if (busy || !hold) return;
    setHoldButtonsBusy(true);
    const r = await api('/api/holds/' + hold.holdId + '?customerId=' + encodeURIComponent(me), { method: 'DELETE' });
    setHoldButtonsBusy(false);
    if (!r.ok) toast('Could not release (' + r.status + ')', true);
    hold = null; await load();
  }

  $('race').onclick = async () => {
    const s = seats.find(x => x.id === picked); if (!s) return;
    $('race').disabled = true;
    const t0 = performance.now();
    const res = await Promise.all(Array.from({ length: 20 }, (_, i) =>
      api('/api/holds', { method: 'POST', body: JSON.stringify({ seatId: s.id, customerId: 'racer-' + i }) })));
    const ms = Math.round(performance.now() - t0);
    const won = res.filter(r => r.status === 201).length, lost = res.filter(r => r.status === 409).length;
    $('raceResult').innerHTML = 'Seat <b>' + s.label + '</b>: <b>' + won + '</b> won, <b>' + lost + '</b> got 409, in ' + ms + ' ms';
    picked = null; await load();
  };

  setInterval(tickHold, 250);
  setInterval(load, 3000);
  $('title').textContent = 'Seat map, show ' + showId;
  load();
})();
</script>
</body>
</html>
