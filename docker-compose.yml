# Local stack: PostgreSQL 16 + the booking API.
#   docker compose up -d --build
# Load test (k6 runs in a container on the same network):
#   docker compose --profile load run --rm k6
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: seatbooking
      POSTGRES_USER: seatbooking
      # Local development only. Override with a real secret anywhere else.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seatbooking}
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbooking -d seatbooking"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Kafka in KRaft mode (no Zookeeper). Single node, local development only.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seatbooking
      DB_USERNAME: seatbooking
      DB_PASSWORD: ${DB_PASSWORD:-seatbooking}
      DB_POOL_SIZE: "30"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BOOKING_HOLD_TTL: PT5M
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080'"]
      interval: 3s
      timeout: 3s
      retries: 40

  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8080
      VUS: ${VUS:-200}
      DURATION: ${DURATION:-60s}
      SHOWS: ${SHOWS:-4}
    volumes:
      - ./load:/load
    command: ["run", "/load/booking-race.js"]
